name: Atualizar o banco de todas as empresas

# Aplica as migrations que faltam no banco de CADA empresa, de uma vez só
# (item 11 da seção 8 do PROJETO_STATUS.md). Antes, cada migration nova era
# colada à mão no SQL Editor de cada projeto Supabase — com três empresas,
# três colagens, e esquecer uma só aparecia depois, como a faixa de "banco
# desatualizado" naquela loja.
#
# Como rodar (é ela quem roda): aba Actions → "Atualizar o banco de todas as
# empresas" → "Run workflow" → escolher o modo → "Run workflow".
#
#   ensaiar (o padrão) — roda o que falta em cada banco e DESFAZ no fim. Não
#     muda nada; diz o que cada banco receberia e se passaria.
#   aplicar — ensaia em todos primeiro; se algum ensaio falhar, não aplica em
#     nenhum. Passando, aplica banco por banco, cada migration na própria
#     transação, e para no primeiro erro.
#
# Migration que declara "versao-minima-do-programa" no cabeçalho (é a exceção:
# a que aperta uma regra que a versão anterior do programa usava) só é
# aplicada quando nenhum computador EM USO está abaixo daquela versão — o robô
# pergunta à tabela `computadores` de cada banco (migration 0063). A caixinha
# "aplicar mesmo com computadores atrasados" passa por cima disso, pra quando
# ela souber que os atrasados não serão afetados.
#
# O resultado aparece em português na página da própria rodada. O passo a
# passo está na seção 9 do PROJETO_STATUS.md, em "Atualizar o banco de todas
# as empresas".
#
# Só roda na mão, de propósito: a ordem "migration antes da versão nova"
# continua valendo, e quem decide a hora é ela. E sempre a partir da main — o
# script recusa se achar um banco mais novo que o código (sinal de branch
# antiga).
#
# Usa o MESMO secret do backup (BACKUP_EMPRESAS): empresa que entra no backup
# entra aqui junto. A lógica está em scripts/atualizar-bancos.mjs, com teste.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "ensaiar = só confere, não muda nada · aplicar = atualiza de verdade"
        required: true
        default: ensaiar
        type: choice
        options:
          - ensaiar
          - aplicar
      aplicar_com_computadores_atrasados:
        description: "Só marque se tiver certeza: aplica mesmo com computadores em uso numa versão do programa mais antiga que a que a migration exige"
        required: false
        default: false
        type: boolean

# Mesmo grupo do backup: os dois nunca mexem no mesmo banco ao mesmo tempo.
# Um espera o outro terminar.
concurrency:
  group: backup-banco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    # Cofre (environment) "lojas": só a `main` abre, e cada rodada espera a
    # aprovação dela antes de começar. É o botão que mexe no banco de todas
    # as empresas, então quem aperta não decide sozinho. O BACKUP_EMPRESAS
    # que ele usa está guardado neste cofre.
    environment: lojas
    # Versão FIXA do Ubuntu, não "latest": a instalação do psql logo abaixo usa
    # o repositório do Postgres pelo codinome do Ubuntu, e um Ubuntu
    # recém-lançado pode ainda não ter esse repositório. O GitHub troca o
    # "latest" pelo 26 em 19/10/2026. Subir este número é decisão, não
    # surpresa — conferir antes que `apt.postgresql.org` já tem o codinome.
    runs-on: ubuntu-24.04
    # Sem limite, o padrão do GitHub são 6 HORAS: uma conexão travada deixaria
    # a rodada pendurada sem aparecer como falha.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Sem cache automático do npm (setup-node v5+): este workflow mexe com
          # publicação, banco ou chaves, e o cache pode ser envenenado (#871).
          package-manager-cache: false

      - name: Instalar o psql
        run: |
          set -euo pipefail
          # Mesma receita do backup, pelo mesmo motivo: o Supabase roda
          # Postgres 17, e o `psql` de /usr/bin escolhe a versão sozinho — e
          # escolhe errado (PROJETO_STATUS.md, §6 item 67). Por isso o caminho
          # completo da versão mais nova instalada.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PSQL=$PG_BIN/psql" >> "$GITHUB_ENV"
          "$PG_BIN/psql" --version

      # O modo e a lista entram por variável de ambiente, nunca direto no
      # comando: texto de formulário e secret são dado, não código. As linhas
      # de conexão são escondidas do registro pelo próprio script
      # (::add-mask::) antes de qualquer outra saída.
      - name: Ensaiar ou aplicar
        env:
          BACKUP_EMPRESAS: ${{ secrets.BACKUP_EMPRESAS }}
          MODO: ${{ inputs.modo }}
          COM_ATRASADOS: ${{ inputs.aplicar_com_computadores_atrasados }}
        run: node scripts/atualizar-bancos.mjs "$MODO" "$COM_ATRASADOS"
