name: Backup do banco

# Uma cópia de segurança própria do banco de cada empresa, todo dia, guardada
# em dois lugares fora do Supabase e cifrada (item TR-12.1 do guia).
#
# POR QUE ISTO EXISTE, se o Supabase já faz backup:
# o plano Pro guarda os ÚLTIMOS 7 DIAS. Parece bastante até o dia em que o
# problema é descoberto na segunda semana — uma tabela corrompida por um bug,
# um `delete` sem `where` rodado no SQL Editor, uma loja que só percebeu a
# falta no fim do mês. Passando de 7 dias, não existe mais de onde voltar.
# Aqui são 30 diárias + 12 mensais, e ficam em lugar nenhum do Supabase: se a
# conta dele for suspensa ou o projeto apagado por engano, a cópia sobrevive.
#
# O QUE VAI DENTRO DE CADA CÓPIA:
#   - o banco inteiro da empresa (schema public: cliente, OS, caixa, estoque…)
#   - os logins (auth.users), sem os quais o banco restaurado não deixa
#     ninguém entrar — `operadores.id` aponta pra lá
#   - os XMLs das notas fiscais, que NÃO ficam no banco e são o documento que
#     a lei manda guardar por 5 anos. Um "backup do banco" que os deixasse de
#     fora seria um backup que mente.
#
# A CHAVE QUE ABRE OS ARQUIVOS NÃO ESTÁ AQUI. O GitHub só tem a chave pública
# (`BACKUP_CHAVE_PUBLICA`), que fecha o cadeado. Abrir só com o
# `chave-do-backup.txt`, que existe fora daqui. Ou seja: mesmo que o
# repositório de backups ou a conta da Cloudflare vazem um dia, o arquivo
# continua ilegível.
#
# COMO ACRESCENTAR UMA EMPRESA NOVA: editar só o secret BACKUP_EMPRESAS,
# acrescentando um bloco. Nada de mexer neste arquivo.
#
# COMO RESTAURAR: RESTAURAR-BACKUP.md, na raiz do repositório.

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília. De madrugada de propósito: se o dump
    # pesar no banco, que pese na hora em que a loja está fechada.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

# Duas rodadas ao mesmo tempo iriam disputar o mesmo nome de arquivo do dia.
concurrency:
  group: backup-banco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    # Os 8 secrets moram no cofre (environment) "backup", que só a `main`
    # abre. Sem isso, qualquer pessoa com escrita no repositório poderia
    # rodar este workflow a partir de uma branch dela, com um passo a mais
    # que mandasse a senha do banco pra fora. Sem aprovação de propósito:
    # o backup das 3h roda sozinho, e uma aprovação o deixaria parado.
    environment: backup
    # Versão FIXA do Ubuntu, não "latest": a instalação do pg_dump usa o
    # repositório do Postgres pelo codinome do Ubuntu (`lsb_release -cs`), e
    # um Ubuntu recém-lançado pode ainda não ter esse repositório — o backup
    # das 3h ficaria vermelho sem ninguém ter mexido em nada. O GitHub troca o
    # "latest" pelo 26 em 19/10/2026. Subir este número é decisão, não
    # surpresa — conferir antes que `apt.postgresql.org` já tem o codinome.
    runs-on: ubuntu-24.04
    # Um backup que não terminou em 20 minutos não vai terminar. Sem este
    # limite, o padrão do GitHub são 6 HORAS — tempo suficiente pro backup do
    # dia não acontecer sem que nada apareça como falha.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar o pg_dump e o age
        run: |
          set -euo pipefail

          # O pg_dump precisa ser da mesma versão OU MAIS NOVO que o servidor,
          # senão ele se recusa a rodar. O Ubuntu do runner traz o 16 e o
          # Supabase já roda 17 em projeto novo — por isso o repositório
          # oficial do Postgres, em vez do que vem de fábrica.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age

          # O `pg_dump` de /usr/bin é um atalho que escolhe a versão sozinho —
          # e escolhe ERRADO: na primeira rodada de verdade ele pegou o 16
          # mesmo com o 17 instalado, e o dump morreu com "server version
          # mismatch" contra um Supabase 17.6. Por isso o caminho completo da
          # versão mais nova instalada, decidido aqui e usado no passo
          # seguinte. Quando o Supabase subir pra 18, é só trocar o número do
          # `apt-get install` acima.
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"

          "$PG_BIN/pg_dump" --version
          age --version

      - name: Tirar, cifrar e guardar as cópias
        env:
          BACKUP_EMPRESAS: ${{ secrets.BACKUP_EMPRESAS }}
          BACKUP_CHAVE_PUBLICA: ${{ secrets.BACKUP_CHAVE_PUBLICA }}
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          GH_REPO: ${{ secrets.BACKUP_REPO }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # O aws-cli novo manda uma soma de verificação que o R2 nem sempre
          # aceita; estas duas linhas mandam só quando for mesmo necessário.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Sem `set -x` em lugar nenhum deste passo: as linhas de conexão
          # trazem a senha do banco dentro delas.
          set -euo pipefail

          if [ -z "${BACKUP_EMPRESAS:-}" ]; then
            echo "::error::O secret BACKUP_EMPRESAS está vazio. Sem ele não há o que copiar."
            exit 1
          fi
          if [ -z "${BACKUP_CHAVE_PUBLICA:-}" ]; then
            echo "::error::O secret BACKUP_CHAVE_PUBLICA está vazio — sem ele o backup sairia sem cadeado, e isso não pode acontecer em silêncio."
            exit 1
          fi

          DIA="$(date -u +%Y-%m-%d)"
          FALHOU=0

          # Ao menos um destino precisa estar configurado.
          TEM_GITHUB=0; [ -n "${GH_REPO:-}" ] && [ -n "${GH_TOKEN:-}" ] && TEM_GITHUB=1
          TEM_R2=0; [ -n "${R2_ENDPOINT:-}" ] && [ -n "${R2_BUCKET:-}" ] && TEM_R2=1
          if [ "$TEM_GITHUB" = 0 ] && [ "$TEM_R2" = 0 ]; then
            echo "::error::Nenhum destino configurado. Faltam os secrets do repositório privado e/ou do R2."
            exit 1
          fi
          [ "$TEM_GITHUB" = 1 ] || echo "::warning::Sem os secrets do repositório privado — hoje o backup vai pra um lugar só."
          [ "$TEM_R2" = 1 ] || echo "::warning::Sem os secrets do R2 — hoje o backup vai pra um lugar só."

          # O BACKUP_EMPRESAS é editado à mão, e um colchete ou uma aspa a
          # menos transforma o erro num `jq: parse error` que não diz nada pra
          # quem não programa. A conferência acontece aqui, com a explicação
          # em português — e antes de qualquer coisa começar.
          if ! echo "$BACKUP_EMPRESAS" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "::error::O secret BACKUP_EMPRESAS não está no formato certo. Ele precisa ser a LISTA inteira, começando com [ e terminando com ], com um bloco { ... } por empresa — não só a chave ou só um pedaço. O modelo está no docs/operacao.md, em 'Backup do banco'."
            exit 1
          fi

          TOTAL="$(echo "$BACKUP_EMPRESAS" | jq 'length')"
          echo "Empresas a copiar: $TOTAL"

          # Cada empresa precisa dos dois campos essenciais; sem eles o erro
          # apareceria bem lá na frente, como "conexão vazia".
          for i in $(seq 0 $((TOTAL - 1))); do
            for CAMPO in nome banco; do
              if [ -z "$(echo "$BACKUP_EMPRESAS" | jq -r ".[$i].$CAMPO // empty")" ]; then
                echo "::error::A empresa de número $((i + 1)) no BACKUP_EMPRESAS está sem o campo \"$CAMPO\"."
                exit 1
              fi
            done
          done

          for i in $(seq 0 $((TOTAL - 1))); do
            EMPRESA="$(echo "$BACKUP_EMPRESAS" | jq -r ".[$i].nome")"
            CONEXAO="$(echo "$BACKUP_EMPRESAS" | jq -r ".[$i].banco")"
            SUPABASE_URL="$(echo "$BACKUP_EMPRESAS" | jq -r ".[$i].supabase_url // empty")"
            SERVICE_KEY="$(echo "$BACKUP_EMPRESAS" | jq -r ".[$i].service_role_key // empty")"

            # O endereço certo é só https://<ref>.supabase.co. A tela "Data
            # API" do Supabase mostra também o da API REST, que termina em
            # /rest/v1/ — colado aqui, o pedido do Storage cai na API REST e
            # volta PGRST125 "Invalid path specified in request URL", que não
            # fala em endereço nenhum. Aconteceu em 29/09/2026. Cortar é
            # seguro: nenhum endereço de projeto termina assim de verdade.
            while [[ "$SUPABASE_URL" == */ ]]; do SUPABASE_URL="${SUPABASE_URL%/}"; done
            if [[ "$SUPABASE_URL" == */rest/v1 ]]; then
              SUPABASE_URL="${SUPABASE_URL%/rest/v1}"
              echo "::warning::O supabase_url de $EMPRESA no BACKUP_EMPRESAS terminava em /rest/v1 (é o endereço da API REST, não o do projeto). Usei só até .supabase.co; vale corrigir lá."
            fi

            # Escondem o valor de qualquer saída, inclusive de um erro do
            # pg_dump que devolvesse a linha de conexão inteira.
            echo "::add-mask::$CONEXAO"
            [ -n "$SERVICE_KEY" ] && echo "::add-mask::$SERVICE_KEY"

            echo "::group::$EMPRESA"

            # O subshell roda SOLTO, e o resultado é lido depois — não dentro
            # de um `if`. Isso NÃO é estilo: dentro de `if ! ( ... )` o bash
            # DESLIGA o `set -e`, então um comando que falhasse no meio não
            # interrompia o resto. Foi o que aconteceu na primeira rodada de
            # verdade: o pg_dump morreu por versão errada e o script seguiu
            # adiante, montando o pacote com um arquivo de 2 linhas dentro.
            # Testado num bash de verdade, não suposto.
            set +e
            (
              set -euo pipefail
              PASTA="copia/$EMPRESA"
              rm -rf "$PASTA" && mkdir -p "$PASTA/notas"

              # 1. Os logins. Vêm PRIMEIRO no arquivo de propósito: a tabela
              #    `operadores` aponta pra `auth.users`, então restaurar na
              #    ordem contrária esbarraria na chave estrangeira.
              echo "-- logins (auth.users)" > "$PASTA/banco.sql"
              "$PG_BIN/pg_dump" "$CONEXAO" --data-only --no-owner \
                --table=auth.users --table=auth.identities >> "$PASTA/banco.sql"

              # 2. O banco da loja: estrutura e dados. As permissões (GRANT)
              #    vão junto de propósito — sem elas a RLS não protege nada
              #    depois de restaurado.
              echo "-- banco da loja (schema public)" >> "$PASTA/banco.sql"
              "$PG_BIN/pg_dump" "$CONEXAO" --schema=public --no-owner >> "$PASTA/banco.sql"

              LINHAS="$(wc -l < "$PASTA/banco.sql")"
              echo "banco.sql: $LINHAS linhas"
              if [ "$LINHAS" -lt 100 ]; then
                echo "::error::O dump de $EMPRESA saiu pequeno demais ($LINHAS linhas) — isso não é um banco inteiro."
                exit 1
              fi

              # 3. Os XMLs das notas fiscais. O próprio banco é o índice de
              #    onde cada arquivo está — é assim que o app faz.
              if [ -n "$SUPABASE_URL" ] && [ -n "$SERVICE_KEY" ]; then
                # Qual chave é esta, afinal? A `anon` e a `service_role` do
                # Supabase são as duas um JWT começando com "eyJ", então é
                # fácil colar uma no lugar da outra — e o sintoma NÃO diz isso:
                # com a `anon`, o Storage responde "Bucket not found", porque
                # ele esconde a existência do bucket de quem não pode vê-lo em
                # vez de responder "sem permissão". Foi exatamente o que
                # aconteceu na primeira rodada, e custou uma investigação.
                # Aqui só o CAMPO `role` é lido e mostrado — nunca a chave.
                PAPEL="$(node -e '
                  const partes = String(process.argv[1]).split(".");
                  if (partes.length !== 3) { console.log("formato-novo"); process.exit(0); }
                  try { console.log(JSON.parse(Buffer.from(partes[1], "base64url")).role || "?"); }
                  catch { console.log("?"); }
                ' "$SERVICE_KEY")"
                echo "chave de $EMPRESA: papel = $PAPEL"

                if [ "$PAPEL" = "anon" ]; then
                  echo "::error::A chave de $EMPRESA no secret BACKUP_EMPRESAS é a 'anon' (a pública, que o app usa), e não a 'service_role'. Com ela o Supabase não deixa ler os XMLs das notas fiscais. Troque em Settings → API Keys → service_role."
                  exit 1
                fi

                # Quais buckets existem mesmo? O Storage responde
                # "Bucket not found" tanto pra bucket inexistente quanto pra
                # bucket que a chave não pode ver — dois problemas bem
                # diferentes, com a mesma cara. Listar separa os dois, e de
                # quebra mostra o nome de verdade se alguém renomear.
                BUCKETS="$(curl -sS --connect-timeout 15 --max-time 30 \
                  -H "Authorization: Bearer $SERVICE_KEY" \
                  -H "apikey: $SERVICE_KEY" \
                  "$SUPABASE_URL/storage/v1/bucket" \
                  | jq -r 'if type == "array" then .[].name else "erro: " + tostring end' 2>/dev/null || echo "?")"
                echo "buckets de $EMPRESA: $(echo "$BUCKETS" | tr '\n' ' ')"

                if ! echo "$BUCKETS" | grep -qx "notas-fiscais"; then
                  echo "::error::O bucket 'notas-fiscais' não aparece em $EMPRESA. O que existe: $(echo "$BUCKETS" | tr '\n' ' ')"
                  # O endereço não é mostrado (o log deste repositório é
                  # público), só o que vem depois de ".supabase.co".
                  if echo "$BUCKETS" | grep -q "PGRST"; then
                    if [[ "$SUPABASE_URL" == *.supabase.co* ]]; then
                      DEPOIS="depois de '.supabase.co' ele tem: '${SUPABASE_URL#*.supabase.co}'"
                    else
                      DEPOIS="ele nem tem '.supabase.co'"
                    fi
                    echo "::error::Quem respondeu foi a API REST, não o Storage. O supabase_url de $EMPRESA tem que ser só https://<código>.supabase.co, sem nada depois, e ${DEPOIS}."
                  fi
                  exit 1
                fi

                "$PG_BIN/psql" "$CONEXAO" -Atc \
                  "select storage_path from notas_fiscais_arquivos where storage_path is not null" \
                  > "$PASTA/notas-lista.txt" || true

                QUANTAS=0
                PEDIDOS=0
                while IFS= read -r CAMINHO; do
                  [ -z "$CAMINHO" ] && continue
                  PEDIDOS=$((PEDIDOS + 1))
                  DESTINO="$PASTA/notas/$(echo "$CAMINHO" | tr '/' '_')"

                  # O código HTTP é lido e MOSTRADO quando dá errado. A versão
                  # anterior usava `curl -f ... 2>/dev/null`, que engolia o
                  # motivo: a primeira rodada de verdade falhou nos 18 arquivos
                  # sem dizer por quê, e "adivinhar a causa duas vezes" é o
                  # erro que este projeto já registrou (§6 item 33).
                  # --max-time não é detalhe: sem ele, UMA conexão travada
                  # deixa o job pendurado até o limite de 6 horas do GitHub, e
                  # o backup do dia simplesmente não acontece — sem erro, sem
                  # aviso, só um job que nunca termina.
                  CODIGO="$(curl -sSL -o "$DESTINO" -w '%{http_code}' \
                    --connect-timeout 15 --max-time 120 --retry 2 \
                    -H "Authorization: Bearer $SERVICE_KEY" \
                    -H "apikey: $SERVICE_KEY" \
                    "$SUPABASE_URL/storage/v1/object/notas-fiscais/$CAMINHO" || echo "000")"

                  if [ "$CODIGO" = "200" ]; then
                    QUANTAS=$((QUANTAS + 1))
                  else
                    # A resposta de erro do Supabase é um JSON curto e NÃO traz
                    # a chave dentro — dá pra mostrar.
                    MOTIVO="$(head -c 200 "$DESTINO" 2>/dev/null | tr -d '\n')"
                    echo "::warning::XML $CAMINHO: HTTP $CODIGO — $MOTIVO"
                    rm -f "$DESTINO"
                  fi
                done < "$PASTA/notas-lista.txt"
                echo "XMLs de nota fiscal: $QUANTAS de $PEDIDOS baixados"

                # Um ou outro falhando é aviso; TODOS falhando é defeito de
                # configuração (chave errada, bucket renomeado), e aí a cópia
                # sai sem os documentos que a lei manda guardar 5 anos. Isso
                # não pode passar como sucesso.
                if [ "$PEDIDOS" -gt 0 ] && [ "$QUANTAS" = 0 ]; then
                  echo "::error::Nenhum dos $PEDIDOS XMLs de nota fiscal de $EMPRESA pôde ser baixado — a cópia sairia sem eles."
                  exit 1
                fi
              else
                echo "::warning::$EMPRESA está sem supabase_url/service_role_key — os XMLs das notas fiscais NÃO entraram nesta cópia."
              fi

              # 4. Um pacote só, fechado com a chave pública.
              ARQUIVO="$EMPRESA-$DIA.age"
              tar -czf - -C "copia" "$EMPRESA" | age -r "$BACKUP_CHAVE_PUBLICA" -o "$ARQUIVO"
              echo "$ARQUIVO: $(du -h "$ARQUIVO" | cut -f1)"

              # 5. Destino 1 — repositório privado, como anexo de uma release.
              #    Anexo e não commit: arquivo binário dentro do Git ficaria no
              #    histórico pra sempre, e o repositório só cresceria.
              if [ "$TEM_GITHUB" = 1 ]; then
                TAG="backup-$EMPRESA"
                gh release view "$TAG" > /dev/null 2>&1 || \
                  gh release create "$TAG" \
                    --title "Cópias de segurança — $EMPRESA" \
                    --notes "Arquivos cifrados. Abrir com o age e o chave-do-backup.txt. Ver RESTAURAR-BACKUP.md no repositório do sistema."
                gh release upload "$TAG" "$ARQUIVO" --clobber

                gh release view "$TAG" --json assets -q '.assets[].name' \
                  | node scripts/retencao-backup.mjs > apagar.txt
                while IFS= read -r VELHO; do
                  [ -z "$VELHO" ] && continue
                  echo "apagando do GitHub: $VELHO"
                  gh release delete-asset "$TAG" "$VELHO" -y
                done < apagar.txt
              fi

              # 6. Destino 2 — Cloudflare R2, em outro fornecedor.
              if [ "$TEM_R2" = 1 ]; then
                aws s3 cp "$ARQUIVO" "s3://$R2_BUCKET/$EMPRESA/$ARQUIVO" \
                  --endpoint-url "$R2_ENDPOINT" --only-show-errors

                aws s3 ls "s3://$R2_BUCKET/$EMPRESA/" --endpoint-url "$R2_ENDPOINT" \
                  | awk '{print $4}' | node scripts/retencao-backup.mjs > apagar-r2.txt
                while IFS= read -r VELHO; do
                  [ -z "$VELHO" ] && continue
                  echo "apagando do R2: $VELHO"
                  aws s3 rm "s3://$R2_BUCKET/$EMPRESA/$VELHO" \
                    --endpoint-url "$R2_ENDPOINT" --only-show-errors
                done < apagar-r2.txt
              fi

              # Nada de arquivo de banco sobrando no disco do runner.
              rm -rf "$PASTA" "$ARQUIVO"
            )
            RESULTADO=$?
            set -e

            if [ "$RESULTADO" != 0 ]; then
              echo "::error::A cópia de $EMPRESA falhou."
              FALHOU=1
            fi

            echo "::endgroup::"
          done

          if [ "$FALHOU" = 1 ]; then
            echo "::error::Pelo menos uma empresa ficou sem cópia hoje."
            exit 1
          fi
          echo "Todas as cópias do dia $DIA foram guardadas."
